name: Build and Commit ash

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # needed to push changes

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Git credentials
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make g++ libreadline-dev

      - name: Configure project
        run: cmake -B build

      - name: Build project
        run: cmake --build build -j$(nproc)

      - name: Remove old ash binary
        run: rm -f ./ash

      - name: Copy new ash binary
        run: cp build/ash ./ash

      - name: Make binary executable
        run: chmod +x ./ash

      - name: Commit and push new binary
        run: |
          git add ash
          git diff --cached --quiet && echo "No changes to commit 🤷" || git commit -m "Auto-build: updated ash binary"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
